[model]
base_weights = "yolo26m.pt"
image_size = 640
confidence_threshold = 0.35
iou_threshold = 0.50
device = "auto"

[training]
epochs = 80
batch_size = 4
patience = 15
workers = 2
seed = 42
deterministic = true

[export]
format = "onnx"
opset = 17
dynamic = true
simplify = true

[paths]
dataset_root = "data/local/indoor_dataset_v1_1"
runs_root = "runs/secondeye"
artifact_root = "artifacts/object_obstacle"

[class_schema]
names = [
  "person",
  "chair",
  "table_desk",
  "sofa",
  "bed",
  "cabinet",
  "doorway_open",
  "door_closed",
  "glass_door",
  "stairs_up",
  "stairs_down",
  "backpack_bag",
  "box",
  "trash_bin",
  "column",
]

[risk]
central_zone_fraction = 0.40
candidate_classes = [
  "person",
  "chair",
  "table_desk",
  "sofa",
  "bed",
  "cabinet",
  "doorway_open",
  "door_closed",
  "glass_door",
  "stairs_up",
  "stairs_down",
  "backpack_bag",
  "box",
  "trash_bin",
  "column",
]
